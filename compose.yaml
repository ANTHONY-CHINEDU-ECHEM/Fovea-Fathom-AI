name: fovea-fathom-ai

services:
  api:
    build:
      context: .
      args:
        INSTALL_ML: "${INSTALL_ML:-false}"
    env_file: .env
    environment:
      FF_VECTOR_BACKEND: "${FF_VECTOR_BACKEND:-memory}"
      FF_QDRANT_URL: http://qdrant:6333
      FF_CACHE_BACKEND: redis
      FF_REDIS_URL: redis://redis:6379/0
      FF_OLLAMA_URL: http://ollama:11434
      FF_LOG_JSON: "true"
    ports: ["8000:8000"]
    volumes:
      - fovea_data:/app/data
    depends_on: [qdrant, redis]
    restart: unless-stopped

  interface:
    build: ./frontend
    ports: ["8080:8080"]
    depends_on: [api]
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    depends_on: [api]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-change-me}"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.4.7
    profiles: ["local"]
    volumes:
      - ollama_models:/root/.ollama
    ports: ["11434:11434"]
    restart: unless-stopped

volumes:
  fovea_data:
  qdrant_data:
  ollama_models:
