# NICE aligned treatment options for the therapy matcher.
#
# Each entry names the governing NICE guidance, its status and the criteria that NICE attaches.
# Statuses: recommended, recommended_with_criteria, research_only, not_recommended, terminated,
# check_appraisal (status could not be confirmed from the guidance text and must be checked).
# Criteria keys understood by fovea.clinical.therapy:
#   bcva_best / bcva_worst      best corrected acuity window as Snellen metres (6/12 means logMAR 0.30)
#   min_cst_um                  minimum central retinal thickness at start of treatment
#   no_permanent_foveal_damage  eye must not have permanent structural damage to the central fovea
#   max_lesion_disc_areas       greatest linear dimension limit in disc areas
#   recent_progression          evidence of recent presumed disease progression required
#   lens_status                 list of permitted lens states
#   requires_prior_failure      condition must have responded insufficiently to, or be unsuitable for, a named class
# Verified against nice.org.uk on 2026-10-30 unless the note says otherwise.
version: "2026.10.1"
review_date: "2026-10-30"

options:
  # Neovascular AMD ---------------------------------------------------------------------
  - id: wet_amd_ranibizumab
    condition: wet_amd
    agent: ranibizumab
    guidance: TA155
    title: Ranibizumab and pegaptanib for the treatment of age related macular degeneration
    published: "2008"
    status: recommended_with_criteria
    line: first
    criteria: {bcva_best: "6/12", bcva_worst: "6/96", no_permanent_foveal_damage: true, max_lesion_disc_areas: 12, recent_progression: true}
    pivotal: ["MARINA", "ANCHOR"]
    note: Pegaptanib is not recommended under TA155.
  - id: wet_amd_aflibercept
    condition: wet_amd
    agent: aflibercept
    guidance: TA294
    title: Aflibercept solution for injection for treating wet age related macular degeneration
    published: "2013-07-24"
    status: recommended_with_criteria
    line: first
    criteria: {bcva_best: "6/12", bcva_worst: "6/96", no_permanent_foveal_damage: true, max_lesion_disc_areas: 12, recent_progression: true}
    pivotal: ["VIEW 1", "VIEW 2"]
    note: Recommended under the same criteria as ranibizumab in TA155, with the agreed commercial arrangement.
  - id: wet_amd_brolucizumab
    condition: wet_amd
    agent: brolucizumab
    guidance: TA672
    title: Brolucizumab for treating wet age related macular degeneration
    published: "2021-02-03"
    status: recommended_with_criteria
    line: first
    criteria: {bcva_best: "6/12", bcva_worst: "6/96", no_permanent_foveal_damage: true, max_lesion_disc_areas: 12, recent_progression: true}
    pivotal: ["HAWK", "HARRIER"]
    note: Continue only while an adequate response is maintained. Choose the least expensive suitable option.
  - id: wet_amd_faricimab
    condition: wet_amd
    agent: faricimab
    guidance: TA800
    title: Faricimab for treating wet age related macular degeneration
    published: "2022-06-29"
    status: recommended_with_criteria
    line: first
    criteria: {bcva_best: "6/12", bcva_worst: "6/96", no_permanent_foveal_damage: true, max_lesion_disc_areas: 12, recent_progression: true}
    pivotal: ["TENAYA", "LUCERNE"]
    note: Recommended with the commercial arrangement. Choose the least expensive suitable option.
  - id: wet_amd_outside_window
    condition: wet_amd
    agent: anti VEGF (any appraised agent)
    guidance: NG82
    title: Age related macular degeneration (NICE guideline NG82)
    published: "2018-01"
    status: recommended_with_criteria
    line: first
    criteria: {outside_window: true}
    pivotal: []
    note: >
      NG82 extends anti VEGF treatment to eyes with acuity better than 6/12, and for eyes at 6/96 or worse
      it should be considered only when an overall benefit to visual function is expected, for example when
      the affected eye is the better seeing eye.
  - id: wet_amd_pdt
    condition: wet_amd
    agent: photodynamic therapy
    guidance: NG82
    title: Age related macular degeneration (NICE guideline NG82)
    published: "2018-01"
    status: research_only
    line: second
    criteria: {}
    pivotal: []
    note: Do not offer alone or as a first line adjunct; as a second line adjunct to anti VEGF only within a randomised trial.
  - id: wet_amd_bevacizumab
    condition: wet_amd
    agent: bevacizumab
    guidance: NG82
    title: Age related macular degeneration (NICE guideline NG82)
    published: "2018-01"
    status: check_appraisal
    line: first
    criteria: {}
    pivotal: ["CATT", "IVAN"]
    note: Unlicensed for intraocular use in the UK. The prescriber takes full responsibility and informed consent must be documented.

