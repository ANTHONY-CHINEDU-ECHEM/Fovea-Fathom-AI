    line: second
    criteria: {requires_prior_failure: available_therapies, lens_status: ["phakic", "pseudophakic"]}
    pivotal: ["FAME"]
    note: >
      Chronic DMO insufficiently responsive to available therapies, irrespective of lens type, with the commercial
      arrangement. TA953 reviewed TA613 (phakic eyes) and merged it with TA301 (pseudophakic eyes); check the
      appraisal for the exact wording and date.

