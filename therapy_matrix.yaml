  # Glaucoma and ocular hypertension ---------------------------------------------------
  - id: oht_slt
    condition: oht
    agent: 360 degree selective laser trabeculoplasty
    guidance: NG81
    title: Glaucoma diagnosis and management (NICE guideline NG81, 2022 update)
    published: "2017-11, updated 2022-01"
    status: recommended_with_criteria
    line: first
    criteria: {min_iop_mmhg: 24, not_pigment_dispersion: true}
    pivotal: ["LiGHT"]
    note: First treatment for ocular hypertension at risk of visual impairment in the person's lifetime; generic prostaglandin analogue drops when SLT is unsuitable or declined.
  - id: oht_pga
    condition: oht
