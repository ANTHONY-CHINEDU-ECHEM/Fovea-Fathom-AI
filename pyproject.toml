[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fovea-fathom-ai"
version = "1.0.0"
description = "Evidence grounded decision support for NHS eye treatment, built on retrieval augmented generation over real, licence tracked ophthalmology knowledge."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Fovea Fathom AI contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
  "Intended Audience :: Healthcare Industry",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
ml = [
  "sentence-transformers>=2.7",
  "qdrant-client>=1.9",
  "redis>=5.0",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
fovea = "fovea.cli:main"
fovea-ingest = "ingestion.cli:main"
fovea-eval = "evaluation.harness:main"

[tool.setuptools.packages.find]
where = ["backend", "."]
include = ["fovea*", "ingestion*", "evaluation*"]

[tool.setuptools.package-data]
fovea = ["knowledge/*.yaml"]
ingestion = ["config/*.yaml", "data/seed/*.jsonl"]
evaluation = ["*.jsonl", "*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = ["network: tests that need live network access (skipped by default)"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["backend", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008", "UP042", "RUF007", "RUF046", "SIM103", "SIM105", "SIM108"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
mypy_path = "backend"
packages = ["fovea"]
